<div class="bp" [class.bp--a11y-preview-only]="previewOnly">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings">
      <div class="bp-settings-head">
        <h2 class="bp-settings-head__title">Component settings</h2>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">
          ↻
        </button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Component</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" disabled>
              <option>Stepper</option>
            </select>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario group</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="selectedRecipeGroup()"
              (ngModelChange)="onRecipeGroupNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (g of recipeGroups; track g) {
                <option [value]="g">{{ g }}</option>
              }
            </select>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="scenario()"
              (ngModelChange)="onScenarioNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of recipesInGroup(selectedRecipeGroup()); track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Orientation</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="orientation()"
              (ngModelChange)="orientation.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (o of orientationOptions; track o) {
                <option [value]="o">{{ o | titlecase }}</option>
              }
            </select>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Step style</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="stepStyle()"
              (ngModelChange)="stepStyle.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (s of styleOptions; track s) {
                <option [value]="s">{{ s | titlecase }}</option>
              }
            </select>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Current step</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              type="number"
              class="bp-dropdown__text"
              min="1"
              [max]="steps().length + 1"
              [ngModel]="currentStep()"
              (ngModelChange)="currentStep.set(+$event)"
              [ngModelOptions]="ngModelStandalone"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Label placement</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="labelPlacement()"
              (ngModelChange)="labelPlacement.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (p of labelPlacementOptions; track p) {
                <option [value]="p">{{ p | titlecase }}</option>
              }
            </select>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Connector gap</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              [ngModel]="connectorGap()"
              (ngModelChange)="connectorGap.set($event)"
              [ngModelOptions]="ngModelStandalone"
              placeholder="0, 2px, 0.2rem"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Current color</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              [ngModel]="currentColor()"
              (ngModelChange)="currentColor.set($event)"
              [ngModelOptions]="ngModelStandalone"
              placeholder="#0062ff or var(--token)"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Completed color</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              [ngModel]="completedColor()"
              (ngModelChange)="completedColor.set($event)"
              [ngModelOptions]="ngModelStandalone"
              placeholder="#0062ff or var(--token)"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">With descriptions</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="withDescriptions() ? 'yes' : 'no'"
              (ngModelChange)="withDescriptions.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="themeService.theme()"
              (ngModelChange)="themeService.setTheme($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of themeRowOptions; track opt.id) {
                <option [value]="opt.id">{{ opt.label }}</option>
              }
            </select>
          </div>
        </div>
        <app-playground-fx-settings [(previewFx)]="previewFx" />

      </div>
    </section>
    <section class="bp-panel bp-panel--preview" aria-labelledby="stp-preview-title">
      <app-playground-preview-header
        titleId="stp-preview-title"
        componentId="stepper"
        [state]="a11yPreviewState()"
      />
      <div class="bp-preview-surface bp-preview-surface--stretch stp-preview">
        <div
          class="stp-preview-inner"
          [class.stp-preview-inner--vertical]="orientation() === 'vertical'"
        >
          <brightrail-stepper [fxShell]="resolvedFxShell()"
            [orientation]="orientation()"
            [stepStyle]="stepStyle()"
            [currentStep]="toApiCurrentStep()"
            [labelPlacement]="labelPlacement()"
            [withDescriptions]="withDescriptions()"
            [connectorGap]="connectorGap()"
            [currentColor]="currentColor()"
            [completedColor]="completedColor()"
          >
            @for (s of steps(); track s.label) {
              <brightrail-step
                [label]="s.label"
                [description]="s.description"
                [status]="s.status"
              />
            }
          </brightrail-stepper>
        </div>
      </div>
    </section>
  </div>
  <section class="bp-code">
    <div class="bp-code__head">
      <h2 class="bp-code__title">Generated snippets</h2>
      <div class="bp-code__tabs" role="tablist">
        <button
          type="button"
          role="tab"
          class="bp-tab"
          [class.is-active]="activeTab() === 'html'"
          (click)="selectTab('html')"
        >
          HTML
        </button>
        <button
          type="button"
          role="tab"
          class="bp-tab"
          [class.is-active]="activeTab() === 'ts'"
          (click)="selectTab('ts')"
        >
          TS
        </button>
        <button
          type="button"
          role="tab"
          class="bp-tab"
          [class.is-active]="activeTab() === 'scss'"
          (click)="selectTab('scss')"
        >
          SCSS
        </button>
      </div>
      <button type="button" class="bp-copy" (click)="copySnippet()">Copy</button>
    </div>
    <pre class="bp-pre"><code>{{ activeSnippet() }}</code></pre>
  </section>
</div>
