<section class="bvc-block">
  <h2 class="bvc-block__h">1. Core badge types</h2>
  <div class="bvc-grid">
    <app-catalog-variation-tile label="Soft · New" [snippet]="s.coreSoftNew">
      <brightrail-badge variant="soft" color="primary" label="New" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Tonal · count" [snippet]="s.coreTonalCount">
      <brightrail-badge variant="tonal" color="neutral" label="47" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Outlined · Product" [snippet]="s.coreOutlinedProduct">
      <brightrail-badge variant="outlined" color="primary" label="Product" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Filled · Primary" [snippet]="s.coreFilledPrimary">
      <brightrail-badge variant="filled" color="primary" label="Primary" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="bvc-block">
  <h2 class="bvc-block__h">2. Badge appearances</h2>
  <div class="bvc-grid">
    <app-catalog-variation-tile label="Filled" [snippet]="s.appearanceFilled">
      <brightrail-badge variant="filled" color="primary" label="Filled" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Outlined" [snippet]="s.appearanceOutlined">
      <brightrail-badge variant="outlined" color="primary" label="Outlined" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Tonal" [snippet]="s.appearanceTonal">
      <brightrail-badge variant="tonal" color="primary" label="Tonal" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Soft" [snippet]="s.appearanceSoft">
      <brightrail-badge variant="soft" color="primary" label="Soft" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="bvc-block">
  <h2 class="bvc-block__h">3. Badge sizes</h2>
  <div class="bvc-grid bvc-grid--sizes">
    <app-catalog-variation-tile label="Small" [snippet]="s.sizeSmall">
      <brightrail-badge variant="filled" color="primary" size="small" label="Small" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Medium" [snippet]="s.sizeMedium">
      <brightrail-badge variant="filled" color="primary" size="medium" label="Medium" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Large" [snippet]="s.sizeLarge">
      <brightrail-badge variant="filled" color="primary" size="large" label="Large" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="bvc-block">
  <h2 class="bvc-block__h">4. Badge states</h2>
  <div class="bvc-grid">
    <app-catalog-variation-tile label="Default" [snippet]="s.stateDefault">
      <brightrail-badge variant="filled" color="primary" state="default" label="Default" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Hover" [snippet]="s.stateHover">
      <brightrail-badge variant="filled" color="primary" state="hover" label="Hover" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Active" [snippet]="s.stateActive">
      <brightrail-badge variant="filled" color="primary" state="active" label="Active" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Disabled" [snippet]="s.stateDisabled">
      <brightrail-badge variant="filled" color="primary" state="disabled" label="Disabled" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="bvc-block">
  <h2 class="bvc-block__h">5. Notification counts</h2>
  <div class="bvc-grid">
    <app-catalog-variation-tile label="Bell · 12" [snippet]="s.notifBell">
      <span class="bco-pill bco-pill--icon">
        <span class="bco-ico bco-ico--bell" aria-hidden="true"></span>
        <brightrail-badge variant="filled" color="primary" label="12" />
      </span>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Alert · 3" [snippet]="s.notifAlert">
      <span class="bco-pill bco-pill--icon">
        <span class="bco-ico bco-ico--alert" aria-hidden="true"></span>
        <brightrail-badge variant="filled" color="warning" label="3" />
      </span>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Mail · 99+" [snippet]="s.notifMail">
      <span class="bco-pill bco-pill--icon">
        <span class="bco-ico bco-ico--mail" aria-hidden="true"></span>
        <brightrail-badge variant="filled" color="primary" label="99+" />
      </span>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Task · 7" [snippet]="s.notifTask">
      <span class="bco-pill bco-pill--icon">
        <span class="bco-ico bco-ico--task" aria-hidden="true"></span>

    </app-catalog-variation-tile>
  </div>
</section>

<section class="bvc-block">

    <app-catalog-variation-tile label="Active" [snippet]="s.statusActive">

    <app-catalog-variation-tile label="Pending" [snippet]="s.statusPending">
      <brightrail-badge variant="tonal" color="warning" label="Pending" />

      <brightrail-badge variant="tonal" color="info" label="In progress" />

    <app-catalog-variation-tile label="Inactive" [snippet]="s.statusInactive">
      <brightrail-badge variant="tonal" color="neutral" label="Inactive" />

    <app-catalog-variation-tile label="Disabled" [snippet]="s.statusDisabled">
      <brightrail-badge variant="tonal" color="neutral" state="disabled" label="Disabled" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="bvc-block">
  <h2 class="bvc-block__h">7. Dot badges</h2>
  <div class="bvc-grid">
    <app-catalog-variation-tile label="Online" [snippet]="s.dotOnline">
      <brightrail-badge variant="filled" color="success" [dot]="true" label="Online" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Away" [snippet]="s.dotAway">
      <brightrail-badge variant="filled" color="warning" [dot]="true" label="Away" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Do not disturb" [snippet]="s.dotDnd">

    <app-catalog-variation-tile label="Offline" [snippet]="s.dotOffline">
      <brightrail-badge variant="filled" color="neutral" [dot]="true" label="Offline" />

    <app-catalog-variation-tile label="Custom" [snippet]="s.dotCustom">
      <brightrail-badge variant="filled" color="primary" [dot]="true" label="Custom" />

<section class="bvc-block">
  <h2 class="bvc-block__h">8. Enterprise patterns</h2>
  <div class="bvc-grid bvc-grid--enterprise">
    <app-catalog-variation-tile label="Dashboard · 5" [snippet]="s.enterpriseDashboard">
      <span class="bco-pill">Dashboard <brightrail-badge variant="filled" color="primary" size="small" label="5" /></span>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Alerts · 3" [snippet]="s.enterpriseAlerts">

    <app-catalog-variation-tile label="Priority · High" [snippet]="s.enterprisePriorityHigh">

    <app-catalog-variation-tile label="Priority · Medium" [snippet]="s.enterprisePriorityMedium">
      <span class="bco-pill"><brightrail-badge variant="tonal" color="warning" size="small" label="Medium" /></span>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Priority · Low" [snippet]="s.enterprisePriorityLow">
      <span class="bco-pill"><brightrail-badge variant="tonal" color="success" size="small" label="Low" /></span>
