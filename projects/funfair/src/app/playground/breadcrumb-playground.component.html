<div class="bp">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings" aria-labelledby="bc-settings-title">
      <div class="bp-settings-head">
        <h2 id="bc-settings-title" class="bp-settings-head__title">Component settings</h2>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">↻</button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row"><span class="bp-setting-row__label">Component</span><div class="bp-dropdown"><select class="bp-dropdown__select" disabled><option>Breadcrumb</option></select></div></div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario group</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="selectedRecipeGroup()" (ngModelChange)="onRecipeGroupNgModelChange($event)" [ngModelOptions]="ngModelStandalone">@for (g of recipeGroups; track g) {<option [value]="g">{{ g }}</option>}</select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="scenario()" (ngModelChange)="onScenarioNgModelChange($event)" [ngModelOptions]="ngModelStandalone">@for (opt of recipesInGroup(selectedRecipeGroup()); track opt.value) {<option [value]="opt.value">{{ opt.label }}</option>}</select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Separator style</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="separator()" (ngModelChange)="separator.set($event)" [ngModelOptions]="ngModelStandalone">@for (s of separatorOptions; track s) {<option [value]="s">{{ s | titlecase }}</option>}</select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">With icons</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="withIcons() ? 'yes' : 'no'" (ngModelChange)="withIcons.set($event === 'yes')" [ngModelOptions]="ngModelStandalone"><option value="yes">Yes</option><option value="no">No</option></select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Max items</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="maxItems()" (ngModelChange)="maxItems.set(+$event)" [ngModelOptions]="ngModelStandalone"><option [value]="3">3</option><option [value]="4">4</option><option [value]="5">5</option></select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Truncation</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="truncation()" (ngModelChange)="truncation.set($event)" [ngModelOptions]="ngModelStandalone">@for (t of truncationOptions; track t) {<option [value]="t">{{ t | titlecase }}</option>}</select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Current item style</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="currentItemStyle()" (ngModelChange)="currentItemStyle.set($event)" [ngModelOptions]="ngModelStandalone">@for (s of currentStyleOptions; track s) {<option [value]="s">{{ s | titlecase }}</option>}</select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Size</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="size()" (ngModelChange)="size.set($event)" [ngModelOptions]="ngModelStandalone">@for (s of sizeOptions; track s) {<option [value]="s">{{ s | titlecase }}</option>}</select></div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown"><select class="bp-dropdown__select" [ngModel]="themeService.theme()" (ngModelChange)="themeService.setTheme($event)" [ngModelOptions]="ngModelStandalone">@for (opt of themeRowOptions; track opt.id) {<option [value]="opt.id">{{ opt.label }}</option>}</select></div>
        </div>
      </div>
    </section>
    <section class="bp-panel bp-panel--preview" aria-labelledby="bc-preview-title">
      <h2 id="bc-preview-title" class="bp-panel__title bp-panel__title--live"><span class="bp-live-dot" aria-hidden="true"></span>Live preview</h2>
      <div class="bp-preview-surface bp-preview-surface--stretch bc-preview">
        <brightrail-breadcrumb
          [items]="items()"
          [separator]="separator()"
          [withIcons]="withIcons()"
          [maxItems]="maxItems()"
          [truncation]="truncation()"
          [currentItemStyle]="currentItemStyle()"
          [size]="size()"
        />
      </div>
    </section>
  </div>
  <section class="bp-code">
    <div class="bp-code__head">
      <h2 class="bp-code__title">Generated snippets</h2>
      <div class="bp-code__tabs" role="tablist">
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'html'" (click)="selectTab('html')">HTML</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'ts'" (click)="selectTab('ts')">TS</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'scss'" (click)="selectTab('scss')">SCSS</button>
      </div>
      <button type="button" class="bp-copy" (click)="copySnippet()">Copy</button>
    </div>
    <pre class="bp-pre"><code>{{ activeSnippet() }}</code></pre>
  </section>
</div>
