<section class="slvc-block">
  <h2 class="slvc-block__h">1. Core slider types</h2>
  <div class="slvc-grid">
    <app-catalog-variation-tile label="Default" [snippet]="s.coreDefault">
      <brightrail-slider [min]="0" [max]="100" [step]="1" ariaLabel="Default" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="With value" [snippet]="s.coreWithValue">
      <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" ariaLabel="Volume" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Custom range" [snippet]="s.coreCustomRange">
      <brightrail-slider [min]="10" [max]="90" [step]="5" [showValue]="true" ariaLabel="Brightness" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Fine step" [snippet]="s.coreFineStep">
      <brightrail-slider [min]="0" [max]="1" [step]="0.1" [showValue]="true" ariaLabel="Opacity" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="slvc-block">
  <h2 class="slvc-block__h">2. Tones</h2>
  <div class="slvc-grid slvc-grid--wide">
    <app-catalog-variation-tile label="Primary" [snippet]="s.tonePrimary">
      <brightrail-slider tone="primary" [showValue]="true" ariaLabel="Primary" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Success" [snippet]="s.toneSuccess">
      <brightrail-slider tone="success" [showValue]="true" ariaLabel="Success" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Warning" [snippet]="s.toneWarning">
      <brightrail-slider tone="warning" [showValue]="true" ariaLabel="Warning" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Danger" [snippet]="s.toneDanger">
      <brightrail-slider tone="danger" [showValue]="true" ariaLabel="Danger" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Neutral" [snippet]="s.toneNeutral">
      <brightrail-slider tone="neutral" [showValue]="true" ariaLabel="Neutral" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="slvc-block">
  <h2 class="slvc-block__h">3. Sizes</h2>
  <p class="slvc-block__hint">sm · md (default) · lg</p>
  <div class="slvc-grid slvc-grid--sizes">
    <app-catalog-variation-tile label="Small" [snippet]="s.sizeSm">
      <brightrail-slider size="sm" [showValue]="true" ariaLabel="Small" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Medium" [snippet]="s.sizeMd">
      <brightrail-slider size="md" [showValue]="true" ariaLabel="Medium" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Large" [snippet]="s.sizeLg">
      <brightrail-slider size="lg" [showValue]="true" ariaLabel="Large" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="slvc-block">
  <h2 class="slvc-block__h">4. States</h2>
  <div class="slvc-grid">
    <app-catalog-variation-tile label="Default" [snippet]="s.stateDefault">
      <brightrail-slider [showValue]="true" ariaLabel="Default" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Disabled" [snippet]="s.stateDisabled">
      <brightrail-slider [disabled]="true" [showValue]="true" ariaLabel="Disabled" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="slvc-block">
  <h2 class="slvc-block__h">5. Range configurations</h2>
  <div class="slvc-stack">
    <app-catalog-variation-tile label="Volume (0–100)" [snippet]="s.rangeVolume">
      <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" ariaLabel="Volume" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Completion %" [snippet]="s.rangePercentage">
      <brightrail-slider [min]="0" [max]="100" [step]="5" [showValue]="true" tone="primary" ariaLabel="Completion" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Temperature" [snippet]="s.rangeTemperature">
      <brightrail-slider [min]="16" [max]="30" [step]="1" [showValue]="true" tone="warning" ariaLabel="Temperature" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Max price" [snippet]="s.rangePrice">
      <brightrail-slider [min]="0" [max]="1000" [step]="50" [showValue]="true" tone="neutral" ariaLabel="Max price" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="slvc-block">
  <h2 class="slvc-block__h">6. Form integration</h2>
  <div class="slvc-stack">
    <app-catalog-variation-tile label="ngModel binding" [snippet]="s.formNgModel">
      <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" ariaLabel="Volume" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Reactive form" [snippet]="s.formReactive">
      <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" ariaLabel="Brightness" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Labeled row" [snippet]="s.formLabeledRow">
      <div class="slco-row">
        <label>Volume</label>
        <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" ariaLabel="Volume" />
      </div>
    </app-catalog-variation-tile>
  </div>
</section>
<section class="slvc-block">
  <h2 class="slvc-block__h">7. Futuristic slider designs</h2>
  <div class="ff-future-grid">
    <app-catalog-variation-tile label="Glass output" [snippet]="s.futuristicGlass">
      <div class="ff-future-shell ff-future-shell--glass">
        <span class="ff-future-shell__label" aria-hidden="true">Glass</span>
        <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" tone="primary" ariaLabel="Glass output" />
      </div>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Neon gain" [snippet]="s.futuristicNeon">
      <div class="ff-future-shell ff-future-shell--neon">
        <span class="ff-future-shell__label" aria-hidden="true">Neon</span>
        <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" tone="primary" ariaLabel="Neon gain" />
      </div>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Cyber throttle" [snippet]="s.futuristicCyber">
      <div class="ff-future-shell ff-future-shell--cyber">
        <span class="ff-future-shell__label" aria-hidden="true">Cyber</span>
        <div class="ff-future-cyber-frame">
          <span class="ff-future-cyber-corner ff-future-cyber-corner--tl" aria-hidden="true"></span>
          <span class="ff-future-cyber-corner ff-future-cyber-corner--tr" aria-hidden="true"></span>
          <span class="ff-future-cyber-corner ff-future-cyber-corner--bl" aria-hidden="true"></span>
          <span class="ff-future-cyber-corner ff-future-cyber-corner--br" aria-hidden="true"></span>
          <brightrail-slider [min]="0" [max]="100" [step]="5" [showValue]="true" tone="danger" ariaLabel="Cyber throttle" />
        </div>
      </div>
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Holo blend" [snippet]="s.futuristicHolo">
      <div class="ff-future-shell ff-future-shell--holo">
        <span class="ff-future-shell__label" aria-hidden="true">Holo</span>
        <brightrail-slider [min]="0" [max]="100" [step]="1" [showValue]="true" tone="success" ariaLabel="Holo blend" />
      </div>
    </app-catalog-variation-tile>
  </div>
</section>
