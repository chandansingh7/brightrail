<div class="bp" [class.bp--a11y-preview-only]="previewOnly">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings" aria-labelledby="sl-settings-title">
      <div class="bp-settings-head">
        <h2 id="sl-settings-title" class="bp-settings-head__title">Component settings</h2>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">
          <span class="bp-sr-only">Reset slider settings</span>
          <svg class="bp-settings-reset__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5 0 1.28-.48 2.45-1.26 3.35l1.41 1.41A6.96 6.96 0 0 0 19 13c0-3.87-3.13-7-7-7zm0 14c-2.76 0-5-2.24-5-5 0-1.28.48-2.45 1.26-3.35L6.85 10.24A6.96 6.96 0 0 0 5 13c0 3.87 3.13 7 7 7v3l4-4-4-4v3z"
            />
          </svg>
        </button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Component</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" disabled><option>Slider</option></select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Pattern category</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="selectedRecipeGroup()"
              (ngModelChange)="onRecipeGroupNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (g of recipeGroups; track g) {
                <option [value]="g">{{ g }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Pattern</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="recipe()"
              (ngModelChange)="onRecipeNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of recipesInGroup(selectedRecipeGroup()); track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Min</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              type="number"
              [ngModel]="min()"
              (ngModelChange)="min.set(+$event)"
              [ngModelOptions]="ngModelStandalone"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Max</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              type="number"
              [ngModel]="max()"
              (ngModelChange)="max.set(+$event)"
              [ngModelOptions]="ngModelStandalone"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Step</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              type="number"
              step="0.1"
              [ngModel]="step()"
              (ngModelChange)="step.set(+$event)"
              [ngModelOptions]="ngModelStandalone"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Aria label</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              [ngModel]="ariaLabel()"
              (ngModelChange)="ariaLabel.set($event)"
              [ngModelOptions]="ngModelStandalone"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Tone</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="tone()"
              (ngModelChange)="tone.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of toneOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Size</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="size()"
              (ngModelChange)="size.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of sizeOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Show value</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="showValue() ? 'yes' : 'no'"
              (ngModelChange)="showValue.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Disabled</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="disabled() ? 'yes' : 'no'"
              (ngModelChange)="disabled.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Use ngModel</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="useNgModel() ? 'yes' : 'no'"
              (ngModelChange)="useNgModel.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="themeService.theme()"
              (ngModelChange)="themeService.setTheme($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of themeRowOptions; track opt.id) {
                <option [value]="opt.id">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="bp-panel bp-panel--preview" aria-labelledby="sl-preview-title">
      <app-playground-preview-header titleId="sl-preview-title" componentId="slider" [state]="a11yPreviewState()" />
      <div class="bp-preview-surface bp-preview-surface--stretch">
        <div class="bp-preview-inner bp-preview-inner--slider">
          @if (recipe() === 'labeled-row') {
            <div class="sl-play-row">
              <label>Volume</label>
              @if (useNgModel()) {
                <brightrail-slider
                  [min]="min()"
                  [max]="max()"
                  [step]="step()"
                  [showValue]="showValue()"
                  [tone]="tone()"
                  [size]="size()"
                  [disabled]="disabled()"
                  [ariaLabel]="ariaLabel()"
                  [(ngModel)]="sliderValue"
                />
              } @else {
                <brightrail-slider
                  [min]="min()"
                  [max]="max()"
                  [step]="step()"
                  [showValue]="showValue()"
                  [tone]="tone()"
                  [size]="size()"
                  [disabled]="disabled()"
                  [ariaLabel]="ariaLabel()"
                  [ngModel]="sliderValue()"
                  (ngModelChange)="onValueChange($event)"
                />
              }
            </div>
          } @else if (useNgModel()) {
            <brightrail-slider
              [min]="min()"
              [max]="max()"
              [step]="step()"
              [showValue]="showValue()"
              [tone]="tone()"
              [size]="size()"
              [disabled]="disabled()"
              [ariaLabel]="ariaLabel()"
              [(ngModel)]="sliderValue"
            />
          } @else {
            <brightrail-slider
              [min]="min()"
              [max]="max()"
              [step]="step()"
              [showValue]="showValue()"
              [tone]="tone()"
              [size]="size()"
              [disabled]="disabled()"
              [ariaLabel]="ariaLabel()"
              [ngModel]="sliderValue()"
              (ngModelChange)="onValueChange($event)"
            />
          }
        </div>
      </div>
    </section>
  </div>

  <section class="bp-code" aria-labelledby="sl-code-title">
    <div class="bp-code__head">
      <h2 id="sl-code-title" class="bp-code__title">Generated snippets</h2>
      <div class="bp-code__tabs" role="tablist">
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'html'" (click)="selectTab('html')">HTML</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'ts'" (click)="selectTab('ts')">TS</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'scss'" (click)="selectTab('scss')">SCSS</button>
      </div>
      <button type="button" class="bp-copy" (click)="copySnippet()">Copy</button>
    </div>
    <pre class="bp-pre" role="tabpanel"><code>{{ activeSnippet() }}</code></pre>
  </section>
</div>
