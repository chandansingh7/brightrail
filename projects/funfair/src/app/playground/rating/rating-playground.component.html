<div class="bp" [class.bp--a11y-preview-only]="previewOnly">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings" aria-labelledby="rating-settings-title">
      <div class="bp-settings-head">
        <div class="bp-settings-head__start">
          <h2 id="rating-settings-title" class="bp-settings-head__title">Component settings</h2>
        </div>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">
          <span class="bp-sr-only">Reset rating settings</span>
          <svg class="bp-settings-reset__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5 0 1.28-.48 2.45-1.26 3.35l1.41 1.41A6.96 6.96 0 0 0 19 13c0-3.87-3.13-7-7-7zm0 14c-2.76 0-5-2.24-5-5 0-1.28.48-2.45 1.26-3.35L6.85 10.24A6.96 6.96 0 0 0 5 13c0 3.87 3.13 7 7 7v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Component</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" disabled><option>Rating</option></select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Max stars</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="max()" (ngModelChange)="max.set(+$event)" [ngModelOptions]="ngModelStandalone">
              <option [value]="5">5</option>
              <option [value]="10">10</option>
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Label</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input class="bp-dropdown__text" [ngModel]="label()" (ngModelChange)="label.set($event)" [ngModelOptions]="ngModelStandalone" />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="themeService.theme()" (ngModelChange)="themeService.setTheme($event)" [ngModelOptions]="ngModelStandalone">
              @for (opt of themeRowOptions; track opt.id) {
                <option [value]="opt.id">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <app-playground-fx-settings [(previewFx)]="previewFx" />

      </div>
    </section>

    <section class="bp-panel bp-panel--preview" aria-labelledby="rating-preview-title">
      <app-playground-preview-header titleId="rating-preview-title" componentId="rating" />
      <div class="bp-preview-surface bp-preview-surface--stretch">
        <div class="bp-preview-inner">
          <brightrail-rating [fxShell]="resolvedFxShell()" [label]="label()" [max]="max()" [ngModel]="score()" (ngModelChange)="score.set($event)" />
          <p class="rt-score">Selected: {{ score() }} / {{ max() }}</p>
        </div>
      </div>
    </section>
  </div>

  <app-playground-snippet-dock headingId="rating-code-title" [htmlSnippet]="htmlSnippet()" [tsSnippet]="tsSnippet" />
</div>
