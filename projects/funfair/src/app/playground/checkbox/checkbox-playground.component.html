<div class="bp" [class.bp--a11y-preview-only]="previewOnly">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings" aria-labelledby="cb-settings-title">
      <div class="bp-settings-head">
        <h2 id="cb-settings-title" class="bp-settings-head__title">Component settings</h2>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">
          <span class="bp-sr-only">Reset checkbox settings</span>
          <svg
            class="bp-settings-reset__icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5 0 1.28-.48 2.45-1.26 3.35l1.41 1.41A6.96 6.96 0 0 0 19 13c0-3.87-3.13-7-7-7zm0 14c-2.76 0-5-2.24-5-5 0-1.28.48-2.45 1.26-3.35L6.85 10.24A6.96 6.96 0 0 0 5 13c0 3.87 3.13 7 7 7v3l4-4-4-4v3z"
            />
          </svg>
        </button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Component</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" disabled>
              <option>Checkbox</option>
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Pattern category</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="selectedRecipeGroup()"
              (ngModelChange)="onRecipeGroupNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (g of recipeGroups; track g) {
                <option [value]="g">{{ g }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Pattern</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="recipe()"
              (ngModelChange)="onRecipeNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of recipesInGroup(selectedRecipeGroup()); track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Tone</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="tone()"
              (ngModelChange)="tone.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of toneOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Variant</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="variant()"
              (ngModelChange)="variant.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of variantOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Status</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="status()"
              (ngModelChange)="status.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of statusOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Label position</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="labelPosition()"
              (ngModelChange)="labelPosition.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of labelPositionOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Size</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="size()"
              (ngModelChange)="size.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of sizeOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">State</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="state()"
              (ngModelChange)="state.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of stateOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Checked icon</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="checkedIcon()"
              (ngModelChange)="checkedIcon.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (v of iconOptions; track v) {
                <option [value]="v">{{ v }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Checked</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="checked() ? 'yes' : 'no'"
              (ngModelChange)="checked.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Indeterminate</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="indeterminate() ? 'yes' : 'no'"
              (ngModelChange)="indeterminate.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Group layout</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [disabled]="!usesGroup()"
              [ngModel]="groupLayout()"
              (ngModelChange)="groupLayout.set($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              <option value="vertical">vertical</option>
              <option value="horizontal">horizontal</option></select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Show select all</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [disabled]="!usesGroup()"
              [ngModel]="showSelectAll() ? 'yes' : 'no'"
              (ngModelChange)="showSelectAll.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Select-all label</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              [disabled]="!usesGroup()"
              [ngModel]="selectAllLabel()"
              (ngModelChange)="selectAllLabel.set($event)"
              [ngModelOptions]="ngModelStandalone"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Option count</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [disabled]="!usesGroup()"
              [ngModel]="optionCount()"
              (ngModelChange)="optionCount.set(+$event)"
              [ngModelOptions]="ngModelStandalone"
            >
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option></select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Required</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="required() ? 'yes' : 'no'"
              (ngModelChange)="required.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Invalid</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="invalid() ? 'yes' : 'no'"
              (ngModelChange)="invalid.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNo; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="themeService.theme()"
              (ngModelChange)="themeService.setTheme($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of themeRowOptions; track opt.id) {
                <option [value]="opt.id">{{ opt.label }}</option>
              }</select
            ><span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <app-playground-fx-settings [(previewFx)]="previewFx" />

      </div>
    </section>

    <section class="bp-panel bp-panel--preview" aria-labelledby="cb-preview-title">
      <app-playground-preview-header titleId="cb-preview-title" componentId="checkbox" [state]="a11yPreviewState()" />
      <div class="bp-preview-surface bp-preview-surface--stretch">
        <div class="bp-preview-inner bp-preview-inner--check">
          @if (usesGroup()) {
            <brightrail-checkbox-group [fxShell]="resolvedFxShell()"
              class="cb-preview-group"
              [options]="groupOptions()"
              [selectedIds]="selectedIds()"
              [parentOptionId]="
                recipe() === 'parent-child' || recipe() === 'mixed-state' ? 'root' : ''
              "
              [layout]="groupLayout()"
              [showSelectAll]="showSelectAll()"
              [selectAllLabel]="selectAllLabel()"
              [tone]="tone()"
              [variant]="variant()"
              [status]="status()"
              [labelPosition]="labelPosition()"
              [size]="size()"
              [state]="state()"
              [checkedIcon]="checkedIcon()"
              (selectedIdsChange)="selectedIds.set($event)"
            />
          } @else {
            <brightrail-checkbox
              [label]="label()"
              [description]="description()"
              [ariaLabel]="ariaLabel()"
              [tone]="tone()"
              [variant]="variant()"
              [status]="status()"
              [labelPosition]="labelPosition()"
              [size]="size()"
              [state]="state()"
              [checkedIcon]="checkedIcon()"
              [errorText]="errorText()"
              [required]="required()"
              [invalid]="invalid()"
              [checked]="checked()"
              [indeterminate]="indeterminate()"
              (checkedChange)="checked.set($event)"
            />
          }
        </div>
      </div>
    </section>
  </div>

  <section class="bp-code" aria-labelledby="cb-code-title">
    <div class="bp-code__head">
      <h2 id="cb-code-title" class="bp-code__title">Generated snippets</h2>
      <div class="bp-code__tabs" role="tablist">
        <button
          type="button"
          role="tab"
          class="bp-tab"
          [class.is-active]="activeTab() === 'html'"
          (click)="selectTab('html')"
        >
          HTML
        </button>
        <button
          type="button"
          role="tab"
          class="bp-tab"
          [class.is-active]="activeTab() === 'ts'"
          (click)="selectTab('ts')"
        >
          TS
        </button>
        <button
          type="button"
          role="tab"
          class="bp-tab"
          [class.is-active]="activeTab() === 'scss'"
          (click)="selectTab('scss')"
        >
          SCSS
        </button>
      </div>
      <button type="button" class="bp-copy" (click)="copySnippet()">Copy</button>
    </div>
    <pre class="bp-pre" role="tabpanel"><code>{{ activeSnippet() }}</code></pre>
  </section>
</div>
