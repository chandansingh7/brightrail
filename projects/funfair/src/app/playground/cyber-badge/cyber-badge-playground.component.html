<div class="bp" [class.bp--a11y-preview-only]="previewOnly">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings" aria-labelledby="cb-settings-title">
      <div class="bp-settings-head">
        <div class="bp-settings-head__start">
          <h2 id="cb-settings-title" class="bp-settings-head__title">Component settings</h2>
        </div>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">
          <span class="bp-sr-only">Reset cyber badge settings</span>
          <svg class="bp-settings-reset__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5 0 1.28-.48 2.45-1.26 3.35l1.41 1.41A6.96 6.96 0 0 0 19 13c0-3.87-3.13-7-7-7zm0 14c-2.76 0-5-2.24-5-5 0-1.28.48-2.45 1.26-3.35L6.85 10.24A6.96 6.96 0 0 0 5 13c0 3.87 3.13 7 7 7v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Component</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" disabled><option>Cyber badge</option></select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Appearance</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="appearance()" (ngModelChange)="appearance.set($event)" [ngModelOptions]="ngModelStandalone">
              <option value="cyber">Cyber</option>
              <option value="neon">Neon</option>
              <option value="holo">Holo</option>
              <option value="glass">Glass</option>
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Status</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="status()" (ngModelChange)="status.set($event)" [ngModelOptions]="ngModelStandalone">
              <option value="online">Online</option>
              <option value="offline">Offline</option>
              <option value="busy">Busy</option>
              <option value="away">Away</option>
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Label</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input class="bp-dropdown__text" [ngModel]="label()" (ngModelChange)="label.set($event)" [ngModelOptions]="ngModelStandalone" />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Pulse</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="pulse() ? 'on' : 'off'" (ngModelChange)="pulse.set($event === 'on')" [ngModelOptions]="ngModelStandalone">
              <option value="on">On</option>
              <option value="off">Off</option>
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="themeService.theme()" (ngModelChange)="themeService.setTheme($event)" [ngModelOptions]="ngModelStandalone">
              @for (opt of themeRowOptions; track opt.id) {
                <option [value]="opt.id">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="bp-panel bp-panel--preview" aria-labelledby="cb-preview-title">
      <app-playground-preview-header titleId="cb-preview-title" componentId="cyber-badge" [state]="a11yPreviewState()" />
      <div class="bp-preview-surface bp-preview-surface--stretch cb-preview-surface">
        <div class="bp-preview-inner">
          <brightrail-cyber-badge
            [label]="label()"
            [appearance]="appearance()"
            [status]="status()"
            [pulse]="pulse()"
          />
        </div>
      </div>
    </section>
  </div>

  <app-playground-snippet-dock
    headingId="cb-code-title"
    [htmlSnippet]="htmlSnippet()"
    [tsSnippet]="tsSnippet()"
    [scssSnippet]="scssSnippet()"
  />
</div>
