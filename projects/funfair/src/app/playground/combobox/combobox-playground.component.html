<div class="bp" [class.bp--a11y-preview-only]="previewOnly">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings" aria-labelledby="combobox-settings-title">
      <div class="bp-settings-head">
        <h2 id="combobox-settings-title" class="bp-settings-head__title">Component settings</h2>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">
          <span class="bp-sr-only">Reset combobox settings</span>
          <svg class="bp-settings-reset__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5 0 1.28-.48 2.45-1.26 3.35l1.41 1.41A6.96 6.96 0 0 0 19 13c0-3.87-3.13-7-7-7zm0 14c-2.76 0-5-2.24-5-5 0-1.28.48-2.45 1.26-3.35L6.85 10.24A6.96 6.96 0 0 0 5 13c0 3.87 3.13 7 7 7v3l4-4-4-4v3z"
            />
          </svg>
        </button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Component</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" disabled><option>Combobox</option></select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario group</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="selectedRecipeGroup()"
              (ngModelChange)="onRecipeGroupNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (g of recipeGroups; track g) {
                <option [value]="g">{{ g }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="recipe()"
              (ngModelChange)="onRecipeNgModelChange($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of recipesInGroup(selectedRecipeGroup()); track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Placeholder</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input
              class="bp-dropdown__text"
              [ngModel]="placeholder()"
              (ngModelChange)="placeholder.set($event)"
              [ngModelOptions]="ngModelStandalone"
            />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Filterable</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="filterable() ? 'yes' : 'no'"
              (ngModelChange)="filterable.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNoOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Disabled</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="disabled() ? 'yes' : 'no'"
              (ngModelChange)="disabled.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNoOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Full width</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="fullWidth() ? 'yes' : 'no'"
              (ngModelChange)="fullWidth.set($event === 'yes')"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of yesNoOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown">
            <select
              class="bp-dropdown__select"
              [ngModel]="themeService.theme()"
              (ngModelChange)="themeService.setTheme($event)"
              [ngModelOptions]="ngModelStandalone"
            >
              @for (opt of themeRowOptions; track opt.id) {
                <option [value]="opt.id">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="bp-panel bp-panel--preview" aria-labelledby="combobox-preview-title">
      <app-playground-preview-header titleId="combobox-preview-title" componentId="combobox" [state]="a11yPreviewState()" />
      <div class="bp-preview-surface bp-preview-surface--stretch">
        <div class="bp-preview-inner bp-preview-inner--combobox">
          @if (recipe() === 'enterprise-pair') {
            <div class="combobox-play-pair">
              <brightrail-combobox
                [options]="countryOptions"
                [placeholder]="placeholder()"
                [filterable]="filterable()"
                [disabled]="disabled()"
                [fullWidth]="fullWidth()"
                [(ngModel)]="selectedValue"
                [ngModelOptions]="ngModelStandalone"
              />
              <brightrail-combobox
                [options]="assigneeOptions"
                placeholder="City"
                [filterable]="true"
                [fullWidth]="fullWidth()"
                [(ngModel)]="cityValue"
                [ngModelOptions]="ngModelStandalone"
              />
            </div>
          } @else {
            <div class="combobox-play-wrap" [class.combobox-play-wrap--inline]="!fullWidth()">
              <brightrail-combobox
                [options]="previewOptions()"
                [placeholder]="placeholder()"
                [filterable]="filterable()"
                [disabled]="disabled()"
                [fullWidth]="fullWidth()"
                [(ngModel)]="selectedValue"
                [ngModelOptions]="ngModelStandalone"
              />
            </div>
          }
        </div>
      </div>
    </section>
  </div>

  <section class="bp-code" aria-labelledby="combobox-code-title">
    <div class="bp-code__head">
      <h2 id="combobox-code-title" class="bp-code__title">Generated snippets</h2>
      <div class="bp-code__tabs" role="tablist">
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'html'" [attr.aria-selected]="activeTab() === 'html'" (click)="selectTab('html')">HTML</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'ts'" [attr.aria-selected]="activeTab() === 'ts'" (click)="selectTab('ts')">TS</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'scss'" [attr.aria-selected]="activeTab() === 'scss'" (click)="selectTab('scss')">SCSS</button>
      </div>
      <button type="button" class="bp-copy" (click)="copySnippet()">Copy</button>
    </div>
    <pre class="bp-pre" role="tabpanel"><code>{{ activeSnippet() }}</code></pre>
  </section>
</div>
