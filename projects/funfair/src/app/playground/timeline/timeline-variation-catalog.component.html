
<section class="tlvc-block">
  <h2 class="tlvc-block__h">1. Core workflow</h2>
  <app-catalog-variation-tile label="Deployment steps" [snippet]="s.coreWorkflow">
    <brightrail-timeline ariaLabel="Deployment progress">
      <brightrail-timeline-item title="Build started" description="CI pipeline #4821" status="completed" />
      <brightrail-timeline-item title="Running tests" description="Unit and integration" status="current" />
      <brightrail-timeline-item title="Deploy" status="pending" />
    </brightrail-timeline>
  </app-catalog-variation-tile>
</section>

<section class="tlvc-block">
  <h2 class="tlvc-block__h">2. Status variants</h2>
  <div class="tlvc-row">
    <app-catalog-variation-tile label="Completed" [snippet]="s.statusCompleted">
      <brightrail-timeline-item title="Payment received" description="Invoice #1042" status="completed" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Current" [snippet]="s.statusCurrent">
      <brightrail-timeline-item title="Under review" description="Compliance" status="current" />
    </app-catalog-variation-tile>
    <app-catalog-variation-tile label="Error" [snippet]="s.statusError">
      <brightrail-timeline-item title="Upload failed" description="Retry" status="error" />
    </app-catalog-variation-tile>
  </div>
</section>

<section class="tlvc-block">
  <h2 class="tlvc-block__h">3. Audit trail</h2>
  <app-catalog-variation-tile label="Enterprise audit" [snippet]="s.auditTrail">
    <brightrail-timeline ariaLabel="Audit trail">
      <brightrail-timeline-item title="Created" description="Jan 4, 2026" status="completed" />
      <brightrail-timeline-item title="Approved" description="Jan 5, 2026" status="completed" />
      <brightrail-timeline-item title="Published" description="Pending" status="current" />
    </brightrail-timeline>
  </app-catalog-variation-tile>
</section>

<section class="tlvc-block">
  <h2 class="tlvc-block__h">4. Descriptions</h2>
  <app-catalog-variation-tile label="Title + description" [snippet]="s.coreWorkflow">
    <brightrail-timeline>
      <brightrail-timeline-item title="Shipped" description="Tracking #8821" status="completed" />
    </brightrail-timeline>
  </app-catalog-variation-tile>
</section>

<section class="tlvc-block">
  <h2 class="tlvc-block__h">5. Mixed statuses</h2>
  <app-catalog-variation-tile label="Success + error" [snippet]="s.mixedStatuses">
    <brightrail-timeline>
      <brightrail-timeline-item title="Submitted" status="completed" />
      <brightrail-timeline-item title="Validation error" status="error" />
      <brightrail-timeline-item title="Resubmit" status="pending" />
    </brightrail-timeline>
  </app-catalog-variation-tile>
</section>

<section class="tlvc-block">
  <h2 class="tlvc-block__h">6. Minimal</h2>
  <app-catalog-variation-tile label="Single item" [snippet]="s.minimalSingle">
    <brightrail-timeline>
      <brightrail-timeline-item title="Account created" status="completed" />
    </brightrail-timeline>
  </app-catalog-variation-tile>
</section>
