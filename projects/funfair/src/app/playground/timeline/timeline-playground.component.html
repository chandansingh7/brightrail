<div class="bp">
  <div class="bp-grid">
    <section class="bp-panel bp-panel--settings" aria-labelledby="tl-settings-title">
      <div class="bp-settings-head">
        <div class="bp-settings-head__start">
          <h2 id="tl-settings-title" class="bp-settings-head__title">Component settings</h2>
        </div>
        <button type="button" class="bp-settings-reset" (click)="resetToDefaults()" title="Reset">
          <span class="bp-sr-only">Reset timeline settings</span>
          <svg class="bp-settings-reset__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5 0 1.28-.48 2.45-1.26 3.35l1.41 1.41A6.96 6.96 0 0 0 19 13c0-3.87-3.13-7-7-7zm0 14c-2.76 0-5-2.24-5-5 0-1.28.48-2.45 1.26-3.35L6.85 10.24A6.96 6.96 0 0 0 5 13c0 3.87 3.13 7 7 7v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
      <div class="bp-settings-block">
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Component</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" disabled><option>Timeline</option></select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario group</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="selectedRecipeGroup()" (ngModelChange)="onRecipeGroupNgModelChange($event)" [ngModelOptions]="ngModelStandalone">
              @for (g of recipeGroups; track g) {
                <option [value]="g">{{ g }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Scenario</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="recipe()" (ngModelChange)="onRecipeNgModelChange($event)" [ngModelOptions]="ngModelStandalone">
              @for (opt of recipesInGroup(selectedRecipeGroup()); track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Aria label</span>
          <div class="bp-dropdown bp-dropdown--text">
            <input class="bp-dropdown__text" [ngModel]="ariaLabel()" (ngModelChange)="ariaLabel.set($event)" [ngModelOptions]="ngModelStandalone" />
          </div>
        </div>
        <div class="bp-setting-row">
          <span class="bp-setting-row__label">Theme</span>
          <div class="bp-dropdown">
            <select class="bp-dropdown__select" [ngModel]="themeService.theme()" (ngModelChange)="themeService.setTheme($event)" [ngModelOptions]="ngModelStandalone">
              @for (opt of themeRowOptions; track opt.id) {
                <option [value]="opt.id">{{ opt.label }}</option>
              }
            </select>
            <span class="bp-dropdown__chev" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="bp-panel bp-panel--preview" aria-labelledby="tl-preview-title">
      <h2 id="tl-preview-title" class="bp-panel__title bp-panel__title--live">
        <span class="bp-live-dot" aria-hidden="true"></span>
        Live preview
      </h2>
      <div class="bp-preview-surface bp-preview-surface--stretch">
        <div class="bp-preview-inner bp-preview-inner--timeline">
          @if (showWorkflow()) {
            <brightrail-timeline [ariaLabel]="ariaLabel()">
              <brightrail-timeline-item title="Build started" description="CI pipeline #4821" status="completed" />
              <brightrail-timeline-item title="Running tests" description="Unit and integration suites" status="current" />
              <brightrail-timeline-item title="Deploy to production" status="pending" />
            </brightrail-timeline>
          }
          @if (showAudit()) {
            <brightrail-timeline [ariaLabel]="ariaLabel()">
              <brightrail-timeline-item title="Created" description="Jan 4, 2026" status="completed" />
              <brightrail-timeline-item title="Approved" description="Jan 5, 2026" status="completed" />
              <brightrail-timeline-item title="Published" description="Pending release" status="current" />
            </brightrail-timeline>
          }
          @if (showMixed()) {
            <brightrail-timeline>
              <brightrail-timeline-item title="Submitted" status="completed" />
              <brightrail-timeline-item title="Validation error" status="error" />
              <brightrail-timeline-item title="Resubmit" status="pending" />
            </brightrail-timeline>
          }
          @if (showMinimal()) {
            <brightrail-timeline>
              <brightrail-timeline-item [title]="itemTitle()" [description]="itemDescription()" [status]="itemStatus()" />
            </brightrail-timeline>
          }
        </div>
      </div>
    </section>
  </div>

  <section class="bp-code" aria-labelledby="tl-code-title">
    <div class="bp-code__head">
      <h2 id="tl-code-title" class="bp-code__title">Generated snippets</h2>
      <div class="bp-code__tabs" role="tablist">
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'html'" [attr.aria-selected]="activeTab() === 'html'" (click)="selectTab('html')">HTML</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'ts'" [attr.aria-selected]="activeTab() === 'ts'" (click)="selectTab('ts')">TS</button>
        <button type="button" role="tab" class="bp-tab" [class.is-active]="activeTab() === 'scss'" [attr.aria-selected]="activeTab() === 'scss'" (click)="selectTab('scss')">SCSS</button>
      </div>
      <button type="button" class="bp-copy" (click)="copySnippet()">Copy</button>
    </div>
    <pre class="bp-pre" role="tabpanel"><code>{{ activeSnippet() }}</code></pre>
  </section>
</div>
