@if (isOpen()) {
  <div class="br-cmd-palette-root" role="presentation">
    <button
      type="button"
      class="br-cmd-palette__backdrop"
      tabindex="-1"
      aria-label="Close command palette"
      (click)="onBackdropClick()"
    ></button>

    <div
      class="br-cmd-palette"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="ariaLabel()"
      (keydown)="onDialogKeydown($event)"
    >
      <div class="br-cmd-palette__search">
        <span class="br-cmd-palette__search-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="1em" height="1em">
            <circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.5" fill="none" />
            <path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        <input
          #queryInput
          type="search"
          class="br-cmd-palette__input"
          [placeholder]="placeholder()"
          [value]="query()"
          (input)="onQueryInput($event)"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <ul class="br-cmd-palette__list" role="listbox" [attr.aria-activedescendant]="activeDescendantId()">
        @if (groupedItems().length === 0) {
          <li class="br-cmd-palette__empty" role="presentation">{{ emptyLabel() }}</li>
        }
        @for (group of groupedItems(); track group.group) {
          @if (group.group) {
            <li class="br-cmd-palette__group-label" role="presentation">{{ group.group }}</li>
          }
          @for (item of group.items; track item.id) {
            <li role="presentation">
              <button
                type="button"
                class="br-cmd-palette__option"
                [id]="optionId(item.id)"
                role="option"
                [class.br-cmd-palette__option--active]="isActive(item.id)"
                [disabled]="item.disabled"
                (click)="selectItem(item)"
                (mouseenter)="setActiveId(item.id)"
              >
                <span class="br-cmd-palette__option-label">{{ item.label }}</span>
                @if (item.shortcut) {
                  <kbd class="br-cmd-palette__shortcut">{{ item.shortcut }}</kbd>
                }
              </button>
            </li>
          }
        }
      </ul>
    </div>
  </div>
}
