name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Library unit tests
        run: npm run test:brightrail

      - name: Consumer package verification
        run: npm run verify:package

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe semantic rules on a11y-preview routes)
        run: npm run e2e:a11y

      - name: Color contrast audit (report-only, does not fail CI)
        run: npm run e2e:a11y:contrast
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-a11y-report
          path: playwright-report/
          retention-days: 7

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual regression gate (Playwright baselines)
        run: npm run e2e:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
